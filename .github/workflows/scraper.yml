name: Avisos Efro B (Asturfutbol)

on:
  schedule:
    # Sábados (6) y Domingos (0) cada 30 minutos entre 06:00 y 15:00 UTC
    # (equivale aproximadamente a 08:00 a 17:00 hora peninsular española)
    - cron: '*/30 6-15 * * 0,6'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

jobs:
  check-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para persistir estado.json mediante commit

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests unitarios
        run: pytest -v

      - name: Consultar resultados y notificar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'efro-b-notificaciones-miguel' }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL || 'miguelmierc@gmail.com' }}
          USER_AGENT_EMAIL: ${{ secrets.USER_AGENT_EMAIL || 'miguelmierc@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python main.py

      - name: Persistir estado.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar estado de partidos [skip ci]"
          file_pattern: "estado.json"
